services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8080"

  worker:
    build:
      context: ../worker
    ports:
      - "8081:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "8080"

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_ENVIRONMENT: local
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:8080"
    environment:
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
